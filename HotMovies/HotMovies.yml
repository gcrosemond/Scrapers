name: HotMovies

driver:
  cookies:
    - CookieURL: "https://www.hotmovies.com"
      Cookies:
        - Name: ageConfirmed
          Domain: ".hotmovies.com"
          Value: "true"
          Path: "/"

groupByName:
  action: scrapeXPath
  queryURL: https://www.hotmovies.com/adult-movies/search?q={}&sort=score
  scraper: hotMoviesGroupSearch

groupByURL:
  - action: scrapeXPath
    url:
      - hotmovies.com/
    scraper: hotMoviesGroupPage

groupByFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: hotMoviesGroupPage

xPathScrapers:
  hotMoviesGroupSearch:
    group:
      Name:
        selector: //div[contains(concat(' ', normalize-space(@class), ' '), ' item-preview-video ')][@itemtitle]/@itemtitle
        postProcess:
          - replace:
              - regex: "\\s+"
                with: " "
      URLs:
        selector: //div[contains(concat(' ', normalize-space(@class), ' '), ' item-preview-video ')][@itemtitle]/a[1]/@href
        postProcess:
          - replace:
              - regex: ^/
                with: https://www.hotmovies.com/
      FrontImage:
        selector: //div[contains(concat(' ', normalize-space(@class), ' '), ' item-preview-video ')][@itemtitle]//img[contains(@alt, 'Boxcover')]/@src

  hotMoviesGroupPage:
    group:
      Name:
        selector: //h1[contains(concat(' ', normalize-space(@class), ' '), ' movie-page__heading__title ')] | //meta[@property='og:title']/@content
        postProcess:
          - replace:
              - regex: "\\s+"
                with: " "
              - regex: "\\s+\\([^)]*\\)\\s*$"
                with: ""
      URLs:
        selector: //link[@rel='canonical']/@href
      Synopsis:
        selector: //div[contains(concat(' ', normalize-space(@class), ' '), ' movie__synopsis ')]//article
        postProcess:
          - replace:
              - regex: "\\s+"
                with: " "
      Date:
        selector: //div[contains(concat(' ', normalize-space(@class), ' '), ' movie__meta ')]//li[strong[contains(normalize-space(.), 'Released:')]]
        postProcess:
          - replace:
              - regex: "^.*Released:\\s*"
                with: ""
          - parseDate: Jan 02 2006
      Duration:
        selector: //div[contains(concat(' ', normalize-space(@class), ' '), ' movie__meta ')]//li[strong[contains(normalize-space(.), 'Run Time:')]]
        postProcess:
          - replace:
              - regex: "^.*Run Time:\\s*"
                with: ""
              - regex: "\\bhrs?\\."
                with: "h"
              - regex: "\\bmins?\\."
                with: "min"
      ContainingGroup:
        selector: //div[contains(concat(' ', normalize-space(@class), ' '), ' movie__meta ')]//li[strong[contains(normalize-space(.), 'Series:')]]/a
      Director:
        selector: //div[contains(concat(' ', normalize-space(@class), ' '), ' movie__meta ')]//li[strong[contains(normalize-space(.), 'Director:')]]/a
        postProcess:
          - replace:
              - regex: "\\s+"
                with: " "
      Studio:
        Name: //div[contains(concat(' ', normalize-space(@class), ' '), ' movie__meta ')]//li[strong[contains(normalize-space(.), 'Studio:')]]/a[1]
      FrontImage:
        selector: //a[@id='front-cover']/img/@src | //meta[@property='og:image']/@content
      BackImage:
        selector: //a[@id='front-cover']/following-sibling::a[contains(@rel, 'boxcoverAlt')][1]/@href
